name: xenra-ios-ui

# Runs the iOS shell in the simulator with the cores stubbed out and photographs
# every screen. See ios/uitest. No signing, no secrets.

on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - 'ios/src/**'
      - 'ios/uitest/**'
      - 'ios/res/**'
      - 'ios/Info.plist'
      - '.github/workflows/xenra-ios-ui.yml'

permissions:
  contents: read


jobs:
  tour:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tour
        run: bash ios/uitest/run.sh "$PWD/ui-tour"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour
          path: ui-tour
          retention-days: 30
