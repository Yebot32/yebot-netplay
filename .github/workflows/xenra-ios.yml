name: xenra-ios

# MILESTONE 2: the full emulator. Links the a64 CPU backend, the Metal GPU
# backend, the kernel and the iOS shell (ios_emu.mm + the UIKit screens). See
# docs/ios-build.md.
#
# The build is TWO-STAGE, and the reason is the Metal shader pipeline:
#   1. A NATIVE macOS configure+build of just the xenia-shader-cc host tool,
#      plus the pinned slangc download. The Metal bytecode must be compiled
#      with -sdk iphoneos (iOS rejects macOS AIR), and the tool that runs
#      xcrun cannot itself be built for iOS.
#   2. The iOS cross build, which points at that host tool via
#      XE_FORCE_HOST_SHADER_CC + XE_HOST_SHADER_CC_PATH and runs the MSL
#      shader rules with XE_METAL_TARGET_SDK=iphoneos.
#
# ------------------------------------------------------------------------
# COST. macOS runners bill at 10x the Linux rate against private-repo
# minutes. Three consequences, all deliberate:
#   * paths filter - a change to Android/Kotlin/Gradle must not spend macOS
#     minutes. Only the iOS plumbing and the parts of the xenia tree this
#     build actually compiles trigger it.
#   * ccache, aggressively, on the (large) iOS cross pass. The native host
#     tool pass is small enough to rebuild uncached.
#   * no matrix, no LTO, one arch, one config.
# If this starts costing real money, drop the push trigger and leave it on
# workflow_dispatch. The push trigger is a convenience, not a requirement.
# ------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - 'CMakeLists.txt'
      - 'ios/**'
      - 'cmake/ios.toolchain.cmake'
      - '.github/workflows/xenra-ios.yml'
      - 'emulator-core/src/main/cpp/xenia/CMakeLists.txt'
      - 'emulator-core/src/main/cpp/xenia/cmake/**'
      - 'emulator-core/src/main/cpp/xenia/xenia-build.py'
      - 'emulator-core/src/main/cpp/xenia/tools/**'
      - 'emulator-core/src/main/cpp/xenia/third_party/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/base/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/gpu/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/ui/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/apu/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/hid/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/vfs/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/patcher/**'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/emulator.*'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/config.*'
  pull_request:
    branches: main
    paths:
      - 'CMakeLists.txt'
      - 'ios/**'
      - 'cmake/ios.toolchain.cmake'
      - '.github/workflows/xenra-ios.yml'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/base/**'

permissions:
  contents: read
  actions: read

env:
  # The CMake source root is THIS repo's root, not the xenia tree. The root
  # CMakeLists.txt is the iOS entry point: it add_subdirectory()s the xenia
  # tree, swaps base/system_mac.cc for ios/system_ios.mm (system() is
  # __API_UNAVAILABLE(ios), a compile error rather than a runtime stub), then
  # adds ios/ which defines xenra-ios. Android never parses that file - Gradle
  # points externalNativeBuild straight at
  # emulator-core/src/main/cpp/CMakeLists.txt - which is what keeps the two
  # builds from being able to break each other.
  XENIA_SRC: .

jobs:
  build-ios-arm64:
    # PINNED, not macos-latest. macos-latest moved from 14 to 15 without notice
    # and will move again; each move changes the Xcode version, which changes
    # the iOS SDK, the clang, and the `xcrun metal` behaviour the shader rules
    # depend on in milestone 2. A green build that goes red because GitHub
    # rolled a label is the least useful kind of red. Bump this deliberately,
    # in its own commit, so the blame is readable.
    # macos-15 is Apple silicon and ships Xcode 16.x.
    runs-on: macos-15

    # `secrets` is NOT an allowed context in a step-level `if`. Using it there
    # does not disable the step - GitHub rejects the whole workflow file, and
    # the run shows up named after the file path with no jobs at all, which is
    # what the first push produced. Job-level env IS allowed to read secrets,
    # so the optional signing steps test env.* instead. An unset secret becomes
    # an empty string here, which is exactly the condition we want.
    env:
      IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}

    steps:

    ##################################################################
    # Checkout
    ##################################################################
    # Shallow, like XenDroid.yml. The only thing here that needs git is the
    # version.h generation in <XEN>/CMakeLists.txt, which calls
    # `git rev-parse HEAD` - depth 1 satisfies that, and the file has a
    # zeroed-out fallback if git fails entirely.
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Configure Git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    ##################################################################
    # Toolchain
    ##################################################################
    # Pin Xcode explicitly rather than trusting the image default: the runner
    # ships several and `xcode-select -p` points at whichever the image
    # maintainers last set. Echo the SDK so a future "why did this break"
    # has the version in the log.
    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
          echo "::warning::Xcode_16 not present, falling back to image default"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-path
        xcrun --sdk iphoneos --show-sdk-version

    - name: Install build tools
      run: |
        brew install ninja
        ninja --version
        cmake --version
        python3 --version

    ##################################################################
    # Native compile cache (ccache)
    ##################################################################
    # Same action and shape as XenDroid.yml. Keyed on the toolchain file
    # because changing the deployment target or sysroot invalidates every
    # object anyway - a stale hit there surfaces as a link error that looks
    # like a code problem.
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ios-arm64-${{ hashFiles('cmake/ios.toolchain.cmake') }}
        max-size: 2G

    - name: Get Git hash
      id: git
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    ##################################################################
    # Stage 1: NATIVE host tool + slangc (for the MSL shader rules)
    ##################################################################
    # xenia-shader-cc runs xcrun metal, so it must be a macOS binary, and the
    # iOS cross toolchain would produce one that cannot run. Build it natively
    # first, then hand it to the cross configure. slangc comes from the pinned
    # Slang release; the shader rules glob .slang/*/bin/slangc under the xenia
    # tree root, which is where the script puts it when run from there - and
    # BOTH configures (native and iOS cross) hard-require slangc at configure
    # time (xe_shader_rules_slang fatals without it), so this runs FIRST.
    - name: Download slangc
      working-directory: emulator-core/src/main/cpp/xenia
      run: |
        python3 xenia-build.py slang
        ls -la .slang/*/bin/

    - name: Build host shader tool (native macOS)
      run: |
        cmake -G Ninja \
          -S emulator-core/src/main/cpp/xenia \
          -B build-host \
          -DCMAKE_BUILD_TYPE=Release \
          -DXENIA_BUILD_TESTS=OFF \
          -DXENIA_BUILD_MISC=OFF \
          -DXENIA_ENABLE_LTO=OFF
        cmake --build build-host --target xenia-shader-cc --parallel $(sysctl -n hw.ncpu)
        ls -la build-host/host_tools/

    ##################################################################
    # Configure
    ##################################################################
    # XENIA_BUILD_TESTS / XENIA_BUILD_MISC stay OFF (their defaults) - the
    # trace viewers and demos are desktop executables that will not link
    # against UIKit. XENIA_ENABLE_LTO is turned OFF explicitly even though its
    # default is ON: ThinLTO turns a two-minute link into a ten-minute one on
    # a runner that bills at 10x, and it cannot change the answer to "does the
    # emulator boot". The host tool from stage 1 feeds the MSL shader rules.
    - name: Configure
      run: |
        cmake -G Ninja \
          -S "$XENIA_SRC" \
          -B build-ios \
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ios.toolchain.cmake" \
          -DCMAKE_BUILD_TYPE=Release \
          -DXENIA_BUILD_TESTS=OFF \
          -DXENIA_BUILD_MISC=OFF \
          -DXENIA_ENABLE_LTO=OFF \
          -DXE_FORCE_HOST_SHADER_CC=ON \
          -DXE_HOST_SHADER_CC_PATH="$GITHUB_WORKSPACE/build-host/host_tools/xenia-shader-cc" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

    ##################################################################
    # Build
    ##################################################################
    # ONLY the xenra-ios target. Naming it is what keeps this from building
    # the wxWidgets desktop shell, the Vulkan backend and every other target
    # the xenia root declares - none of which link on iOS. The target itself
    # now pulls the whole engine: a64 CPU backend, Metal GPU/UI backends,
    # kernel, VFS, and the ios_emu.mm shell.
    - name: Build
      # Tee the output: GitHub prunes job log blobs aggressively, and a
      # compile error nobody can read is the least useful kind.
      run: |
        set -o pipefail
        cmake --build build-ios --target xenra-ios --parallel $(sysctl -n hw.ncpu) -- -k 0 2>&1 | tee build-log.txt

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ steps.git.outputs.hash }}
        path: build-log.txt
        if-no-files-found: ignore

    ##################################################################
    # Package the .ipa
    ##################################################################
    # An .ipa is a zip with the .app inside a TOP-LEVEL directory named
    # exactly "Payload" - not "payload", not the app's name - and the .app
    # must be a direct child of it. Get any of that wrong and installd rejects
    # the archive with a message that says nothing useful.
    #
    # The original Xbox core is built by xemu-ios-core.yml, which takes far
    # longer than this job and changes far less. Without one the app still
    # builds, and the library says so.
    - name: Fetch the original Xbox core
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        APP=$(find build-ios -maxdepth 5 -name 'xenra-ios.app' -type d | head -n 1)
        RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow xemu-ios-core.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        if [ -z "$RUN" ]; then
          echo "::warning::No xemu-ios-core build yet."
          exit 0
        fi
        gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name xemu-ios-core --dir core-artifact
        tar -xzf core-artifact/xemu-ios-core.tar.gz -C core-artifact
        mkdir -p "$APP/Frameworks"
        cp -R core-artifact/core/. "$APP/Frameworks/"
        install_name_tool -add_rpath @loader_path "$APP/Frameworks/libxemu-ios-core.dylib" || true
        ls -la "$APP/Frameworks"

    # This produces an UNSIGNED ipa, and that is the default, not a failure
    # mode. A user on Windows signs it with their own certificate via
    # Sideloadly, and that path is the one that actually yields a
    # get-task-allow signature. See docs/ios-build.md.
    - name: Package ad-hoc signed IPA
      id: package
      run: |
        set -euo pipefail
        APP=$(find build-ios -maxdepth 5 -name 'xenra-ios.app' -type d | head -n 1)
        if [ -z "$APP" ]; then
          echo "::error::No xenra-ios.app produced by the build."
          find build-ios -maxdepth 6 -name '*.app' || true
          exit 1
        fi
        echo "Found app bundle: $APP"

        # A bundle with no Mach-O in it zips fine, installs fine, and crashes
        # on launch. Catch it here, where the message is readable.
        if [ ! -f "$APP/xenra-ios" ]; then
          echo "::error::Bundle has no executable at $APP/xenra-ios"
          ls -la "$APP"
          exit 1
        fi
        file "$APP/xenra-ios"

        # Same for the Info.plist: an empty CFBundleIdentifier passes every
        # build step and fails at install time blaming the provisioning
        # profile. Assert it here instead.
        BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
        if [ -z "$BUNDLE_ID" ]; then
          echo "::error::CFBundleIdentifier is empty in $APP/Info.plist"
          exit 1
        fi
        echo "Bundle identifier: $BUNDLE_ID"

        rm -rf payload-staging
        mkdir -p payload-staging/Payload
        cp -R "$APP" payload-staging/Payload/
        PAYLOAD_APP="payload-staging/Payload/$(basename "$APP")"

        # A flat bundle, the layout the simulator tour runs. CMake leaves a
        # Resources folder at the root, and with one there codesign takes the
        # .lproj folders beside it for broken nested bundles.
        if [ -d "$PAYLOAD_APP/Resources" ]; then
          cp -R "$PAYLOAD_APP/Resources/." "$PAYLOAD_APP/"
          rm -rf "$PAYLOAD_APP/Resources"
        fi
        # The launch colour lives in a compiled catalogue. actool needs a simulator
        # runtime matching its Xcode, and the Xcode this build selects has none on
        # the image, so try the others. Without it the launch screen is only plain.
        if [ ! -f "$PAYLOAD_APP/Assets.car" ]; then
          for XCODE in /Applications/Xcode_16.4*.app /Applications/Xcode_26*.app /Applications/Xcode_16.*.app; do
            [ -d "$XCODE" ] || continue
            if DEVELOPER_DIR="$XCODE/Contents/Developer" xcrun actool ios/res/Launch.xcassets                  --compile "$PAYLOAD_APP" --platform iphoneos --minimum-deployment-target 16.0                  --target-device iphone --target-device ipad                  --output-partial-info-plist "$RUNNER_TEMP/launch-assets.plist" >/dev/null 2>&1                && [ -f "$PAYLOAD_APP/Assets.car" ]; then
              echo "Launch colour compiled with $XCODE"
              break
            fi
          done
          [ -f "$PAYLOAD_APP/Assets.car" ] || echo "::warning::No Assets.car, plain launch screen"
        fi
        LANGS=$(ls "$PAYLOAD_APP"/*.lproj/Localizable.strings | wc -l)
        if [ "$LANGS" -ne 8 ]; then
          echo "::error::Expected 8 languages in the bundle, found $LANGS"
          exit 1
        fi
        for FILE in X1_Covers.txt xenra_x.png setup_logo_x.png; do
          [ -f "$PAYLOAD_APP/$FILE" ] || { echo "::error::$FILE missing"; exit 1; }
        done

        # AD-HOC SIGN, rather than shipping a bare unsigned bundle.
        #
        # Entitlements exist ONLY inside a code signature - a plist sitting
        # next to the app grants nothing. An unsigned ipa therefore carries no
        # entitlements at all, so increased-memory-limit and friends are simply
        # absent, and a re-signing tool has nothing to preserve. Ad-hoc signing
        # (identity "-") needs no certificate and no keychain, embeds the
        # entitlements in the bundle, and leaves an ipa that Sideloadly/Xcode
        # re-sign with a real identity while keeping them.
        # Canonicalise the plist before handing it to codesign.
        #
        # The first attempt failed with "Failed to parse entitlements:
        # AMFIUnserializeXML: syntax error near line 5". That was not AMFI
        # being fussy - the file was genuinely malformed. A documentation
        # comment contained the literal `--` (in `codesign --entitlements`),
        # which XML forbids inside a comment. Fixed at the source.
        #
        # plutil stays as the guard rather than as the fix: it fails loudly
        # here, in a step whose job is packaging, rather than letting a
        # future malformed comment reach codesign and produce an error that
        # points at line numbers in a file nobody suspects. It also strips
        # comments, so the plist codesign sees is minimal regardless.
        ENT="$RUNNER_TEMP/xenra.entitlements.clean.plist"
        plutil -convert xml1 -o "$ENT" "$GITHUB_WORKSPACE/ios/xenra.entitlements"

        codesign --force --deep --sign - --entitlements "$ENT" "$PAYLOAD_APP"

        # Report what the signature actually GRANTED, not what we asked for.
        # These can differ, and the difference is invisible until the app
        # misbehaves on device.
        echo "--- entitlements embedded in the bundle ---"
        codesign -d --entitlements :- "$PAYLOAD_APP" 2>/dev/null ||           echo "::warning::could not read back entitlements"

        IPA="xenra-ios_${{ steps.git.outputs.hash }}.ipa"
        # ditto, not zip: it preserves symlinks, resource forks and the bundle
        # bit-for-bit, which matters once a signature is present - a zip that
        # rewrites any of that invalidates the signature it just packaged.
        # --keepParent is what makes "Payload" the top-level entry.
        (cd payload-staging && ditto -c -k --sequesterRsrc --keepParent           "Payload" "../$IPA")
        echo "ipa=$IPA" >> $GITHUB_OUTPUT
        ls -la "$IPA"

    ##################################################################
    # Upload the unsigned artifact FIRST
    ##################################################################
    # Before any signing is attempted, so a signing misconfiguration still
    # leaves a downloadable build behind. Signing is the optional part.
    - name: Upload ad-hoc signed IPA
      uses: actions/upload-artifact@v4
      with:
        name: xenra-ios-adhoc-${{ steps.git.outputs.hash }}
        path: ${{ steps.package.outputs.ipa }}
        if-no-files-found: error

    ##################################################################
    # Sign (OPTIONAL)
    ##################################################################
    # Everything below is conditional on the secrets existing. An absent
    # secret is the NORMAL case - a fork, an outside PR, a fresh clone - and
    # must never fail the build.
    #
    # Note what a CI signature can and cannot do. Signing with a DEVELOPMENT
    # certificate and a development provisioning profile yields get-task-allow
    # and therefore a JIT-capable build, but only for the device UDIDs listed
    # in that profile. Signing with a DISTRIBUTION certificate yields an app
    # that installs more widely and has NO JIT, because distribution
    # signatures strip get-task-allow. Do not add a distribution path and call
    # it done - read docs/ios-build.md first.
    - name: Import signing certificate
      if: ${{ env.IOS_CERT_P12 != '' }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/xenra-signing.keychain-db"
        KEYCHAIN_PASS=$(uuidgen)
        security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
        security set-keychain-settings -lut 900 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

        echo "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" \
          -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        # Without this, codesign blocks on a GUI keychain-access prompt that
        # nobody is there to answer and the job hangs until it times out.
        security set-key-partition-list -S apple-tool:,apple: \
          -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" \
          $(security list-keychains -d user | tr -d '"')

        rm -f "$RUNNER_TEMP/cert.p12"
        echo "KEYCHAIN=$KEYCHAIN" >> $GITHUB_ENV

    - name: Install provisioning profile
      if: ${{ env.IOS_CERT_P12 != '' && env.IOS_PROVISIONING_PROFILE != '' }}
      run: |
        set -euo pipefail
        PROFILE="$RUNNER_TEMP/xenra.mobileprovision"
        echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
        echo "PROFILE=$PROFILE" >> $GITHUB_ENV
        # Report what the profile actually grants rather than assuming. If
        # get-task-allow is false or absent here, the resulting ipa has no JIT
        # no matter what xenra.entitlements says.
        security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
        echo "--- provisioning profile entitlements ---"
        /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" || true

    - name: Sign IPA
      if: ${{ env.IOS_CERT_P12 != '' && env.IOS_PROVISIONING_PROFILE != '' }}
      run: |
        set -euo pipefail
        rm -rf signed && mkdir signed && cd signed
        unzip -q "../${{ steps.package.outputs.ipa }}"
        APP="Payload/xenra-ios.app"

        # The profile must be embedded IN the bundle. codesign does not put it
        # there and installd will not accept the app without it.
        cp "$PROFILE" "$APP/embedded.mobileprovision"

        IDENTITY="${IOS_SIGNING_IDENTITY:-}"
        if [ -z "$IDENTITY" ]; then
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | head -n 1 | awk -F'"' '{print $2}')
        fi
        echo "Signing with: $IDENTITY"

        codesign --force --timestamp=none \
          --sign "$IDENTITY" \
          --entitlements "$GITHUB_WORKSPACE/ios/xenra.entitlements" \
          --keychain "$KEYCHAIN" \
          "$APP"

        # Print the entitlements that ended up in the signature. This is the
        # authoritative answer to "does this build have JIT" - look for
        # com.apple.security.get-task-allow.
        echo "--- signed entitlements ---"
        codesign -d --entitlements :- "$APP" || true

        zip -qry "../xenra-ios_${{ steps.git.outputs.hash }}_signed.ipa" Payload

    - name: Clean up keychain
      # always(), so a failed signing step does not leave a certificate behind.
      # Runners are ephemeral, but relying on that is a bad habit.
      if: ${{ always() && env.KEYCHAIN != '' }}
      run: security delete-keychain "$KEYCHAIN" || true

    - name: Upload signed IPA
      if: ${{ env.IOS_CERT_P12 != '' && env.IOS_PROVISIONING_PROFILE != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: xenra-ios-signed-${{ steps.git.outputs.hash }}
        path: xenra-ios_${{ steps.git.outputs.hash }}_signed.ipa
        if-no-files-found: warn
